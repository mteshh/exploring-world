<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Destinations | Exploring World</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(4, 7, 10, 0.82),
                    rgba(4, 7, 10, 0.91)
                ),

                url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;

            background-position: center;

            position: relative;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .background-glow {

            position: absolute;

            width: 600px;
            height: 600px;

            left: 24%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        245,
                        197,
                        66,
                        0.10
                    ),
                    transparent 68%
                );

            filter: blur(35px);

            pointer-events: none;

            z-index: 1;
        }


        /* =========================
           STARS
        ========================= */

        .stars {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 2;
        }


        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #f5c542;

            opacity: 0.35;

            animation:
                twinkle 4s infinite ease-in-out;
        }


        @keyframes twinkle {

            0% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.55;
            }

            100% {
                opacity: 0.15;
            }

        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 76px;

            padding:
                0 65px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(0, 0, 0, 0.35);

            border-bottom:
                1px solid
                rgba(
                    245,
                    197,
                    66,
                    0.10
                );

            z-index: 100;
        }


        .logo {

            font-size: 26px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .logo span {

            color: #f5c542;
        }


        nav ul {

            display: flex;

            gap: 32px;

            list-style: none;
        }


        nav a {

            text-decoration: none;

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        nav a:hover {

            color: #f5c542;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            position: relative;

            width: 100%;

            height: 100vh;

            padding-top: 76px;

            display: flex;

            z-index: 10;
        }


        /* =========================
           LEFT / GLOBE
        ========================= */

        .left {

            width: 43%;

            height:
                calc(100vh - 76px);

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        .globe-wrapper {

            width: 440px;

            height: 440px;

            position: relative;
        }


        #globe {

            width: 100%;

            height: 100%;
        }


        .globe-label {

            position: absolute;

            bottom: 4px;

            left: 50%;

            transform:
                translateX(-50%);

            color: #aaa;

            font-size: 11px;

            letter-spacing: 2px;

            white-space: nowrap;
        }


        /* =========================
           RIGHT CONTENT
        ========================= */

        .right {

            width: 57%;

            height:
                calc(100vh - 76px);

            display: flex;

            align-items: center;

            padding:
                20px 7% 20px 2%;
        }


        .content {

            width: 100%;

            max-width: 700px;
        }


        .small-title {

            color: #f5c542;

            font-size: 12px;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }


        h1 {

            font-size: 49px;

            line-height: 1.05;

            margin-bottom: 13px;
        }


        h1 span {

            color: #f5c542;
        }


        .intro {

            color: #bdbdbd;

            font-size: 15px;

            line-height: 1.6;

            max-width: 580px;

            margin-bottom: 25px;
        }


        /* =========================
           DESTINATION GRID
        ========================= */

        .destination-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            max-width: 650px;
        }


        .destination-card {

            text-decoration: none;

            color: white;

            min-height: 85px;

            padding:
                15px 18px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 13px;

            background:
                rgba(
                    10,
                    10,
                    10,
                    0.45
                );

            backdrop-filter:
                blur(8px);

            display: flex;

            align-items: center;

            gap: 14px;

            transition:
                0.3s ease;
        }


        .destination-card:hover {

            border-color:
                rgba(
                    245,
                    197,
                    66,
                    0.75
                );

            background:
                rgba(
                    245,
                    197,
                    66,
                    0.08
                );

            transform:
                translateY(-3px);
        }


        .flag {

            font-size: 29px;
        }


        .card-text h3 {

            font-size: 16px;

            margin-bottom: 4px;
        }


        .card-text p {

            color: #999;

            font-size: 11px;
        }


        .arrow {

            margin-left: auto;

            color: #f5c542;

            font-size: 18px;

            transition: 0.3s;
        }


        .destination-card:hover
        .arrow {

            transform:
                translateX(5px);
        }


        /* =========================
           EXPLORE MORE
        ========================= */

        .explore-more {

            display: inline-block;

            margin-top: 19px;

            padding:
                10px 20px;

            border-radius: 25px;

            background: #f5c542;

            color: #111;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.3s;
        }


        .explore-more:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 25px
                rgba(
                    245,
                    197,
                    66,
                    0.25
                );
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 950px) {

            .left {

                width: 40%;
            }


            .right {

                width: 60%;
            }


            .globe-wrapper {

                width: 350px;

                height: 350px;
            }


            h1 {

                font-size: 39px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            nav {

                padding:
                    0 25px;
            }


            nav ul {

                gap: 15px;
            }


            nav a {

                font-size: 12px;
            }


            .logo {

                font-size: 20px;
            }


            .main {

                flex-direction: column;

                overflow: hidden;
            }


            .left {

                width: 100%;

                height: 43vh;
            }


            .right {

                width: 100%;

                height: 57vh;

                padding:
                    5px 25px;

                align-items:
                    flex-start;
            }


            .globe-wrapper {

                width: 260px;

                height: 260px;
            }


            h1 {

                font-size: 32px;
            }


            .destination-grid {

                gap: 7px;
            }


            .destination-card {

                min-height: 65px;

                padding: 10px;
            }


            .flag {

                font-size: 22px;
            }


            .card-text h3 {

                font-size: 13px;
            }


            .card-text p {

                font-size: 9px;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background-glow"></div>


    <div class="stars">

        <span class="star"
              style="top:12%;left:8%;"></span>

        <span class="star"
              style="top:20%;left:18%;"></span>

        <span class="star"
              style="top:15%;left:85%;"></span>

        <span class="star"
              style="top:32%;left:92%;"></span>

        <span class="star"
              style="top:65%;left:8%;"></span>

        <span class="star"
              style="top:80%;left:87%;"></span>

        <span class="star"
              style="top:88%;left:40%;"></span>

    </div>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">

            🌍 Exploring <span>World</span>

        </div>


        <ul>

            <li>

                <a href="./index.html">

                    Home

                </a>

            </li>


            <li>

                <!-- FIXED ABOUT LINK -->

                <a href="./index.html#about">

                    About

                </a>

            </li>

        </ul>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main">


        <!-- GLOBE -->

        <section class="left">

            <div class="globe-wrapper">

                <div id="globe"></div>

                <div class="globe-label">

                    DRAG • ROTATE • DISCOVER

                </div>

            </div>

        </section>


        <!-- DESTINATIONS -->

        <section class="right">

            <div class="content">


                <div class="small-title">

                    DESTINATION EXPLORER

                </div>


                <h1>

                    Explore
                    <span>The World</span>

                </h1>


                <p class="intro">

                    Discover remarkable places,
                    cultures and experiences.
                    Choose a destination and
                    begin your journey.

                </p>


                <div class="destination-grid">


                    <a href="india.html"
                       class="destination-card">

                        <div class="flag">
                            🇮🇳
                        </div>

                        <div class="card-text">

                            <h3>
                                India
                            </h3>

                            <p>
                                Culture • Heritage • Adventure
                            </p>

                        </div>

                        <div class="arrow">
                            →
                        </div>

                    </a>

            </div>

        </section>

    </main>


    <!-- =========================
         THREE.JS GLOBE
    ========================= -->

    <script>

        const container =
            document.getElementById(
                "globe"
            );


        const scene =
            new THREE.Scene();


        const camera =
            new THREE.PerspectiveCamera(

                45,

                container.clientWidth /
                container.clientHeight,

                0.1,

                1000

            );


        camera.position.z = 4.2;


        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                alpha: true

            });


        renderer.setPixelRatio(
            window.devicePixelRatio
        );


        renderer.setSize(

            container.clientWidth,

            container.clientHeight

        );


        renderer.setClearColor(
            0x000000,
            0
        );


        container.appendChild(
            renderer.domElement
        );


        const textureLoader =
            new THREE.TextureLoader();


        const earthTexture =
            textureLoader.load(

                "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"

            );


        const earthBump =
            textureLoader.load(

                "https://unpkg.com/three-globe/example/img/earth-topology.png"

            );


        const earthGeometry =
            new THREE.SphereGeometry(

                1.45,

                64,

                64

            );


        const earthMaterial =
            new THREE.MeshPhongMaterial({

                map: earthTexture,

                bumpMap: earthBump,

                bumpScale: 0.035,

                shininess: 12

            });


        const earth =
            new THREE.Mesh(

                earthGeometry,

                earthMaterial

            );


        scene.add(earth);


        const ambientLight =
            new THREE.AmbientLight(

                0xffffff,

                1.4

            );


        scene.add(ambientLight);


        const sunLight =
            new THREE.DirectionalLight(

                0xffffff,

                2

            );


        sunLight.position.set(

            5,
            3,
            5

        );


        scene.add(sunLight);


        const destinations = [

            {
                name: "India",
                lat: 20.5937,
                lng: 78.9629,
                page: "india.html"
            },

            {
                name: "Japan",
                lat: 36.2048,
                lng: 138.2529,
                page: "japan.html"
            },

            {
                name: "France",
                lat: 46.2276,
                lng: 2.2137,
                page: "france.html"
            },

            {
                name: "Italy",
                lat: 41.8719,
                lng: 12.5674,
                page: "italy.html"
            },

            {
                name: "USA",
                lat: 37.0902,
                lng: -95.7129,
                page: "usa.html"
            },

            {
                name: "Australia",
                lat: -25.2744,
                lng: 133.7751,
                page: "australia.html"
            }

        ];


        function convertPosition(

            lat,
            lng,
            radius

        ) {

            const phi =
                (90 - lat) *
                Math.PI / 180;


            const theta =
                (lng + 180) *
                Math.PI / 180;


            return new THREE.Vector3(

                -radius *
                Math.sin(phi) *
                Math.cos(theta),

                radius *
                Math.cos(phi),

                radius *
                Math.sin(phi) *
                Math.sin(theta)

            );

        }


        const markers = [];


        destinations.forEach(

            destination => {

                const geometry =
                    new THREE.SphereGeometry(

                        0.022,

                        16,

                        16

                    );


                const material =
                    new THREE.MeshBasicMaterial({

                        color: 0xf5c542

                    });


                const marker =
                    new THREE.Mesh(

                        geometry,
                        material

                    );


                marker.position.copy(

                    convertPosition(

                        destination.lat,
                        destination.lng,
                        1.50

                    )

                );


                marker.userData =
                    destination;


                earth.add(marker);


                markers.push(marker);

            }

        );


        let dragging = false;

        let previousX = 0;

        let previousY = 0;


        container.addEventListener(

            "mousedown",

            event => {

                dragging = true;

                previousX =
                    event.clientX;

                previousY =
                    event.clientY;

            }

        );


        window.addEventListener(

            "mouseup",

            () => {

                dragging = false;

            }

        );


        container.addEventListener(

            "mousemove",

            event => {

                if (!dragging)
                    return;


                const movementX =
                    event.clientX -
                    previousX;


                const movementY =
                    event.clientY -
                    previousY;


                earth.rotation.y +=
                    movementX * 0.006;


                earth.rotation.x +=
                    movementY * 0.003;


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;

            }

        );


        let touchX = 0;


        container.addEventListener(

            "touchstart",

            event => {

                touchX =
                    event.touches[0]
                    .clientX;

            }

        );


        container.addEventListener(

            "touchmove",

            event => {

                const newX =
                    event.touches[0]
                    .clientX;


                earth.rotation.y +=

                    (newX - touchX)
                    * 0.006;


                touchX = newX;

            }

        );


        /* =========================
           SCROLL TO ZOOM
        ========================= */

        container.addEventListener(

            "wheel",

            event => {

                event.preventDefault();


                camera.position.z +=
                    event.deltaY * 0.0025;


                camera.position.z =
                    Math.min(

                        camera.position.z,
                        6

                    );


                camera.position.z =
                    Math.max(

                        camera.position.z,
                        2.7

                    );

            },

            { passive: false }

        );


        /* =========================
           CLICK DESTINATION
        ========================= */

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();


        container.addEventListener(

            "click",

            event => {

                const rect =
                    container
                    .getBoundingClientRect();


                mouse.x =

                    ((event.clientX -
                    rect.left) /
                    rect.width)
                    * 2 - 1;


                mouse.y =

                    -((event.clientY -
                    rect.top) /
                    rect.height)
                    * 2 + 1;


                raycaster.setFromCamera(

                    mouse,

                    camera

                );


                const intersects =
                    raycaster.intersectObjects(
                        markers
                    );


                if (
                    intersects.length > 0
                ) {

                    const destination =
                        intersects[0]
                        .object
                        .userData;


                    window.location.href =
                        destination.page;

                }

            }

        );


        /* =========================
           ANIMATION
        ========================= */

        function animate() {

            requestAnimationFrame(
                animate
            );


            if (!dragging) {

                earth.rotation.y +=
                    0.0012;

            }


            renderer.render(

                scene,

                camera

            );

        }


        animate();


        /* =========================
           RESIZE
        ========================= */

        window.addEventListener(

            "resize",

            () => {

                camera.aspect =

                    container.clientWidth /
                    container.clientHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    container.clientWidth,

                    container.clientHeight

                );

            }

        );

    </script>

</body>

</html>
